name: Publish AE Tuner 0.4.4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.4.4.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish validated stable release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-28c0-81f4-9639-6d0232a014a5/raw?se=2026-09-11T05%3A24%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=13a3184d-995c-51c4-a717-d7a1f83e6d02&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T08%3A42%3A49Z&ske=2026-09-11T08%3A42%3A49Z&sks=b&skv=2026-02-06&sig=n8IQ9YNXpYq1PNO6GBctyv1LzybHwviHz3fkWvJVWT8%3D'
          EXPECTED_SHA256: '1a60283a4414167142fbd8a96584780caf52a7eb8cbaba2ae88b466016df1bfd'
          VERSION: '0.4.4'
          TAG: 'v0.4.4'
          RELEASE_COMMIT: '4f6769f3804613ebfdc15ff72829013f50189a3b'
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace immutable release assets." >&2
            exit 1
          fi

          curl --fail --location --retry 3 "$ARTIFACT_URL" --output validated-artifact.zip
          rm -rf validated-artifact
          mkdir validated-artifact
          unzip -q validated-artifact.zip -d validated-artifact

          JAR="$(find validated-artifact -type f -name 'ae-tuner-epicefi-0.4.4.jar' -print -quit)"
          test -n "$JAR"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$JAR" | sha256sum --check --strict -

          cp "$JAR" "ae-tuner-epicefi-${VERSION}.jar"
          printf '%s  %s\n' "$EXPECTED_SHA256" "ae-tuner-epicefi-${VERSION}.jar" > SHA256SUMS.txt

          gh release create "$TAG" \
            "ae-tuner-epicefi-${VERSION}.jar" \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "AE Tuner (EPICEFI) ${VERSION}" \
            --notes-file docs/RELEASE_0.4.4.md

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,url,assets

          rm -rf validated-artifact validated-artifact.zip \
            "ae-tuner-epicefi-${VERSION}.jar" SHA256SUMS.txt
          rm -f .github/workflows/publish-v0.4.4.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- .github/workflows/publish-v0.4.4.yml
          git diff --cached --check
          git commit -m "release: remove one-time v0.4.4 publisher"
          git push origin HEAD:main
