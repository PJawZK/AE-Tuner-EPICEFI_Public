name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYNTHETIC_INTEGRATION_OUT: ${{ github.workspace }}/target/synthetic-plugin-integration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate repository
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate.sh 2>&1 | tee /tmp/ae-tuner-validation.log

      - name: Upload repository validation failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-failure
          path: /tmp/ae-tuner-validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Gate automated Apply/Restore validation runner
        run: |
          java -cp "target/classes:target/test-classes:lib/TunerStudioPluginAPI.jar" \
            se.anders.tunerstudio.aetuner.host.AeApplyRestoreValidationAutomationRegressionTest

      - name: Ensure virtual display
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb
          fi
          command -v xvfb-run

      - name: Exercise real synthetic plugin panel
        run: bash scripts/synthetic-plugin-integration.sh

      - name: Upload structural UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: ae-tuner-v019-structural-ui-evidence
          path: target/synthetic-plugin-integration
          if-no-files-found: error
          retention-days: 14

      - name: Verify canonical JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find dist -maxdepth 1 -name 'ae-tuner-epicefi-*.jar' -type f -print | sort)
          test "${#jars[@]}" -eq 1
          sha256sum "${jars[0]}"

      - name: Upload validated JAR
        uses: actions/upload-artifact@v4
        with:
          name: ae-tuner-epicefi-main
          path: dist/ae-tuner-epicefi-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Summarize synthetic evidence generated during run
        if: always()
        shell: bash
        run: |
          if [[ -d "$SYNTHETIC_INTEGRATION_OUT" ]]; then
            find "$SYNTHETIC_INTEGRATION_OUT" -type f -print0 | sort -z | xargs -0 -r sha256sum
          else
            echo 'No synthetic evidence directory was produced.'
          fi
