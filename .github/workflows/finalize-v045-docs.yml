name: Finalize v0.4.5 release provenance

on:
  push:
    branches:
      - 20260921-release-v045

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record final qualified public provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          sha = '673fdf0c577ea07764519e596a99100c21a4c0450d2c4b02a2178a79ac70efa0'
          source = '5e08562fd31295aab3fd1b150d03b681d3c79738'
          run = '35575578436'
          artifact = '10627721208'
          src_tree = 'dce349f02ec7a9e1ecbed3a32c71524cfb92fdfc'

          p = Path('README.md')
          s = p.read_text()
          old = '## Public release candidate\n\nRelease target: **v0.4.5**  \nPlugin: `ae-tuner-epicefi-0.4.5.jar`  \nJava target: Java 8 bytecode  \nFinal SHA-256: recorded from the exact public qualification artifact before merge/release.'
          new = '## Public release\n\nRelease: **v0.4.5**  \nPlugin: `ae-tuner-epicefi-0.4.5.jar`  \nJava target: Java 8 bytecode  \nSHA-256: `' + sha + '`'
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('from the v0.4.5 GitHub Release once published.', 'from the v0.4.5 GitHub Release.', 1)
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          old = 'Status: **PUBLIC RELEASE CANDIDATE**. Intended to replace `v0.4.4` after exact public qualification.'
          new = 'Status: **PUBLIC RELEASE**. Replaces `v0.4.4`.'
          assert old in s
          s = s.replace(old, new, 1)
          old = '- Final public JAR SHA-256 is recorded from the exact qualified public PR head before publication.'
          new = ('- Exact public-identity source `' + source + '` passed the complete private permanent pipeline: CI **#1716 / run `' + run + '` — PASS**.\n'
                 '- Qualified public artifact ID: `' + artifact + '`.\n'
                 '- Canonical public JAR: `ae-tuner-epicefi-0.4.5.jar`.\n'
                 '- Canonical public JAR SHA-256: `' + sha + '`.\n'
                 '- Public `src/`, `pom.xml` and `scripts/` were independently checked against that qualified public-identity source after repairing the release export; `src/` matches exact Git tree `' + src_tree + '`.')
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('docs/BUILD_AND_RELEASE.md')
          s = p.read_text()
          start = s.index('## Current v0.4.4 provenance')
          end = s.index('\n## TunerStudio installation', start)
          new = '''## Current v0.4.5 provenance

- qualified private runtime source: `b9ec558a206408dd4e19cff8ce24b2eceb36f331`;
- exact public-identity qualification source: `''' + source + '''`;
- full private CI #1716 / `''' + run + '''`: PASS;
- qualified artifact ID: `''' + artifact + '''`;
- JAR: `ae-tuner-epicefi-0.4.5.jar`;
- SHA-256: `''' + sha + '''`;
- public product-source parity: `src/` Git tree `''' + src_tree + '''`, with `pom.xml` and `scripts/` also matching the qualified public-identity source exactly.
'''
          s = s[:start] + new + s[end:]
          p.write_text(s)

          p = Path('docs/RELEASE_0.4.5.md')
          s = p.read_text()
          old = '''- Public runtime promotion commit: `5afb85c416a24026cde53e3148b4787c3a641837`
- Public version identity: `0.4.5` / `PUBLIC RELEASE`
- Canonical public JAR target: `ae-tuner-epicefi-0.4.5.jar`
- Final public qualification, artifact ID and JAR SHA-256 are recorded from the exact final PR head before publication.'''
          new = '''- Exact public-identity qualification source: `''' + source + '''`
- Exact public-identity qualification: CI **#1716 / run `''' + run + '''` — PASS**
- Qualified public artifact ID: `''' + artifact + '''`
- Public version identity: `0.4.5` / `PUBLIC RELEASE`
- Canonical public JAR: `ae-tuner-epicefi-0.4.5.jar`
- Canonical public JAR SHA-256: `''' + sha + '''`
- Public product-source parity was independently verified after export repair: `src/` matches Git tree `''' + src_tree + '''`; `pom.xml` and `scripts/` also match the qualified public-identity source exactly.'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Publish clean docs-only finalization
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-v045-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md docs/BUILD_AND_RELEASE.md docs/RELEASE_0.4.5.md .github/workflows/finalize-v045-docs.yml
          git commit -m 'docs: record qualified v0.4.5 release provenance'
          git push --force-with-lease=refs/heads/20260921-release-v045:${GITHUB_SHA} origin HEAD:refs/heads/20260921-release-v045
